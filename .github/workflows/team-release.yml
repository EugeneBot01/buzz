name: Team Release

# Builds "official Buzz desktop + team-patches/*.patch" for macOS (Apple
# Silicon + Intel) and publishes it as a GitHub release of this repo.
#
# Derived from upstream block/buzz .github/workflows/release.yml (macOS jobs),
# minus Apple codesign/notarize (no Apple Developer account): the app is
# ad-hoc signed instead, and the updater points at this repo's team-latest
# release instead of block/buzz.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           updater private key (contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   TEAM_UPDATER_PUBLIC_KEY             matching public key (contents)

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Official Buzz version to build on (e.g. 0.5.26)"
        required: true
      build_number:
        description: "Team build number for this official version (1, 2, 3, ...)"
        required: true
        default: "1"
      publish:
        description: "Send to team apps as an update. Leave OFF for a test build."
        type: boolean
        default: false

concurrency:
  group: team-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: block/buzz
  UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/team-latest/latest.json

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
    steps:
      - name: Determine version
        id: version
        env:
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::upstream_version must look like 0.5.26 (got '$UPSTREAM_VERSION')"; exit 1;
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::build_number must be 1, 2, 3, ... (got '$BUILD_NUMBER')"; exit 1;
          }
          # Semver pre-release: team.2 > team.1, and 0.5.27-team.1 > 0.5.26-team.9.
          echo "version=${UPSTREAM_VERSION}-team.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=desktop-v${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check secrets are configured
        env:
          HAS_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          HAS_PUBLIC_KEY: ${{ secrets.TEAM_UPDATER_PUBLIC_KEY != '' }}
        run: |
          missing=0
          [[ "$HAS_PRIVATE_KEY" == true ]] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set"; missing=1; }
          [[ "$HAS_PASSWORD" == true ]] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set"; missing=1; }
          [[ "$HAS_PUBLIC_KEY" == true ]] || { echo "::error::secret TEAM_UPDATER_PUBLIC_KEY is not set"; missing=1; }
          exit "$missing"

      - name: Check upstream tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          gh api "repos/${UPSTREAM_REPO}/git/ref/tags/${UPSTREAM_TAG}" >/dev/null || {
            echo "::error::official tag ${UPSTREAM_TAG} not found in ${UPSTREAM_REPO}"; exit 1;
          }

      - name: Refuse to overwrite an existing team release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "team-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release team-v${VERSION} already exists. Use the next build_number."
            exit 1
          fi

  check:
    name: Apply patches and test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_TAG: ${{ needs.setup.outputs.upstream_tag }}
    steps:
      - name: Checkout official source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          persist-credentials: false

      - name: Checkout team patches
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: team
          persist-credentials: false

      - name: Apply team patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(team/team-patches/*.patch)
          [[ ${#patches[@]} -gt 0 ]] || { echo "::error::no patches in team-patches/"; exit 1; }
          for p in "${patches[@]}"; do
            echo "Applying $(basename "$p")"
            git apply --3way "$p" || {
              echo "::error::$(basename "$p") does not apply to ${UPSTREAM_TAG}. Re-implement it from section 3 of its doc in team-patches/."
              exit 1
            }
          done

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: cd desktop && pnpm typecheck

      - name: Unit tests
        run: cd desktop && pnpm test

  build:
    name: Build macOS (${{ matrix.arch }})
    needs: [setup, check]
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          # Apple Silicon: host build, with the local-LLM feature, like upstream.
          - arch: aarch64
            target: ""
            features: "--features mesh-llm"
            mesh: true
            bundle_dir: desktop/src-tauri/target/release/bundle
          # Intel: cross-compiled, without mesh-llm, like upstream.
          - arch: x64
            target: x86_64-apple-darwin
            features: ""
            mesh: false
            bundle_dir: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      UPSTREAM_TAG: ${{ needs.setup.outputs.upstream_tag }}
      TARGET: ${{ matrix.target }}
      BUNDLE_DIR: ${{ matrix.bundle_dir }}
    steps:
      - name: Checkout official source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          persist-credentials: false

      - name: Checkout team patches
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: team
          persist-credentials: false

      - name: Apply team patches
        run: |
          set -euo pipefail
          for p in team/team-patches/*.patch; do
            echo "Applying $(basename "$p")"
            git apply --3way "$p"
          done

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add "$TARGET"

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config (team updater + ad-hoc signing)
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.TEAM_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: |
          set -euo pipefail
          cd desktop
          node scripts/build-release-config.mjs
          # No Apple Developer ID: "-" makes Tauri ad-hoc sign the whole bundle
          # (inside-out, with Entitlements.plist) so macOS does not report it
          # as damaged.
          node -e '
            const fs = require("node:fs");
            const f = "src-tauri/tauri.release.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.macOS.signingIdentity = "-";
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '
          cat src-tauri/tauri.release.conf.json

      - name: Build sidecars
        run: |
          set -euo pipefail
          PKGS=(-p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli)
          if [[ -n "$TARGET" ]]; then
            cargo build --release --target "$TARGET" "${PKGS[@]}"
            ./scripts/bundle-sidecars.sh "$TARGET"
          else
            cargo build --release "${PKGS[@]}"
            ./scripts/bundle-sidecars.sh
          fi

      # --- mesh-llm native libraries (Apple Silicon only), copied from upstream ---
      - name: Resolve mesh-llm rev
        if: matrix.mesh
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Restore mesh llama build cache
        if: matrix.mesh
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}
      - name: Build mesh llama native libraries
        if: matrix.mesh && steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Save mesh llama build cache
        if: matrix.mesh && steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build Tauri app
        env:
          FEATURES: ${{ matrix.features }}
          BUZZ_UPDATER_PUBLIC_KEY: ${{ secrets.TEAM_UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail
          ARGS=(--verbose --config src-tauri/tauri.release.conf.json)
          [[ -n "$TARGET" ]] && ARGS+=(--target "$TARGET")
          # shellcheck disable=SC2206
          [[ -n "$FEATURES" ]] && ARGS+=($FEATURES)
          cd desktop && pnpm tauri build "${ARGS[@]}"

      - name: Verify ad-hoc signature
        run: |
          set -euo pipefail
          APP="$BUNDLE_DIR/macos/Buzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO=$(codesign -dv "$APP" 2>&1)
          echo "$INFO"
          grep -q "Signature=adhoc" <<<"$INFO" || { echo "::error::app is not ad-hoc signed"; exit 1; }
          desktop/scripts/verify-macos-entitlements.sh "$APP"

      - name: Locate build artifacts
        id: artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          [[ -n "$DMG" ]] || { echo "::error::No DMG found in $BUNDLE_DIR/dmg"; exit 1; }
          DMG_OUT="$RUNNER_TEMP/out/Buzz_${VERSION}_${ARCH}.dmg"
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' -type f | head -1)
          [[ -n "$ARCHIVE" && -f "${ARCHIVE}.sig" ]] || {
            echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos"; exit 1;
          }
          ARCHIVE_OUT="$RUNNER_TEMP/out/Buzz_${VERSION}_${ARCH}.app.tar.gz"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$DMG" "$DMG_OUT"
          cp "$ARCHIVE" "$ARCHIVE_OUT"
          cp "${ARCHIVE}.sig" "${ARCHIVE_OUT}.sig"
          ls -la "$RUNNER_TEMP/out"

      - name: Stage release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: team-release-${{ matrix.arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/out/*

  publish:
    name: Publish release
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      UPSTREAM_TAG: ${{ needs.setup.outputs.upstream_tag }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: team-release-*
          path: staged
          merge-multiple: true

      - name: Generate latest.json
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/team-v${VERSION}"
          ARM="Buzz_${VERSION}_aarch64.app.tar.gz"
          X64="Buzz_${VERSION}_x64.app.tar.gz"
          for f in "$ARM" "$X64"; do
            [[ -f "staged/$f" && -f "staged/$f.sig" ]] || { echo "::error::missing staged/$f(.sig)"; exit 1; }
          done
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Buzz team build v$VERSION (official $UPSTREAM_TAG + team patches)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg arm_sig "$(cat "staged/$ARM.sig")" --arg arm_url "$BASE/$ARM" \
            --arg x64_sig "$(cat "staged/$X64.sig")" --arg x64_url "$BASE/$X64" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
               "darwin-aarch64": {signature: $arm_sig, url: $arm_url},
               "darwin-x86_64":  {signature: $x64_sig, url: $x64_url}
             }}' > latest.json
          cat latest.json

      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          공식 Buzz \`${UPSTREAM_TAG}\` + 팀 패치 (\`team-patches/\`).

          **처음 설치**
          - Apple 칩 맥(M1/M2/M3…): \`Buzz_${VERSION}_aarch64.dmg\`
          - Intel 맥: \`Buzz_${VERSION}_x64.dmg\`
          - Apple 인증이 없는 앱이라 처음 열 때 경고가 떠요. 시스템 설정 → 개인정보 보호 및 보안 → "그래도 열기".
          - 업데이트 후 키체인 창이 뜨면 맥 로그인 비밀번호 → "항상 허용".

          이미 팀 버전을 쓰고 있으면 앱 안의 "업데이트"로 받으면 돼요.
          EOF

      - name: Create versioned release
        run: |
          set -euo pipefail
          FLAGS=(--prerelease)
          [[ "$PUBLISH" == true ]] && FLAGS=(--latest)
          gh release create "team-v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buzz Team v${VERSION}$([[ "$PUBLISH" == true ]] || echo ' (test)')" \
            --notes-file notes.md \
            "${FLAGS[@]}" \
            staged/* latest.json

      - name: Point team apps at this release
        if: inputs.publish
        run: |
          set -euo pipefail
          if ! gh release view team-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create team-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Team update feed (do not delete)" \
              --notes "Team apps read latest.json from this release to find updates. Deleting it stops all updates." \
              --prerelease
          fi
          gh release upload team-latest latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "team-latest now points at v${VERSION}"
